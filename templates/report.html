<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        @page {
            size: {{ 'A4' }};
            margin: 2cm 2.5cm;
            @bottom-center {
                content: "Страница " counter(page) " из " counter(pages);
                font-size: 9pt;
                color: #888;
            }
        }

        body {
            font-family: "{{ font_family }}", "Noto Sans", "DejaVu Sans", Arial, sans-serif;
            font-size: 11pt;
            line-height: 1.6;
            color: #1a1a1a;
        }

        .header {
            border-bottom: 2px solid #6b21a8;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #6b21a8;
            font-size: 22pt;
            margin: 0 0 5px 0;
        }

        .meta {
            color: #666;
            font-size: 9pt;
        }

        .meta span {
            margin-right: 15px;
        }

        h1 {
            color: #1a1a1a;
            font-size: 18pt;
            margin-top: 20px;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 5px;
        }

        h2 {
            color: #6b21a8;
            font-size: 14pt;
            margin-top: 18px;
        }

        h3 {
            color: #374151;
            font-size: 12pt;
            margin-top: 14px;
        }

        p {
            margin: 8px 0;
            text-align: justify;
        }

        ul, ol {
            margin: 8px 0;
            padding-left: 25px;
        }

        li {
            margin: 4px 0;
        }

        blockquote {
            border-left: 3px solid #6b21a8;
            margin: 12px 0;
            padding: 8px 15px;
            background: #faf5ff;
            color: #4a4a4a;
            font-style: italic;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 10pt;
        }

        th, td {
            border: 1px solid #d1d5db;
            padding: 6px 10px;
            text-align: left;
        }

        th {
            background: #f3e8ff;
            color: #6b21a8;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background: #f9fafb;
        }

        code {
            background: #f3f4f6;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 10pt;
        }

        pre {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 9pt;
        }

        strong {
            color: #1a1a1a;
        }

        .footer {
            margin-top: 30px;
            padding-top: 10px;
            border-top: 1px solid #e5e5e5;
            font-size: 8pt;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ title }}</h1>
        <div class="meta">
            <span>{{ date }}</span>
            {% if source_file %}
            <span>{{ source_file }}</span>
            {% endif %}
        </div>
    </div>

    <div class="content">
        {{ content }}
    </div>

    <div class="footer">
        {{ title }} • {{ date }}
    </div>
</body>
</html>
